requirement: 'Modéliser l''essai de désenfumage NIST/UL n°2 dans un domaine x 0,00..6,10,
  y -1,10..4,30, z 0,00..4,00 m, avec un maillage uniforme de 0,15 m et une durée
  de 950 s. Les faces x=0, x=6,10 et y=4,30 sont des parois fermées, et le sol en
  z=0 est plein. La pièce est fermée par un mur de façade x 0,00..6,10, y -0,10..0,00,
  z 0,00..2,40, percé d''une porte x 4,30..5,20, y -0,20..0,10, z 0,00..2,10. Le plafond
  est une dalle x 0,00..6,10, y -0,10..4,30, z 2,40..2,50, percée d''un exutoire x
  1,80..4,20, y 1,50..2,70, z 2,30..2,60. Autour de cet exutoire, quatre costières
  vont de z 2,50 à 3,00 : x 1,70..1,80 et x 4,20..4,30 (y 1,40..2,80), puis y 1,40..1,50
  et y 2,70..2,80 (x 1,80..4,20). Dans l''essai, deux couvercles en z 3,00..3,10 s''ouvrent
  à 570 s puis à 820 s. Pour simplifier, on considère l''exutoire comme ouvert. Le
  foyer est un brûleur au méthane posé sur un bloc x 0,00..0,80, y 3,50..4,30, z 0,00..0,40,
  avec une surface de combustion au sommet (z=0,40). Sa puissance de 2144 kW est atteinte
  en 10 s, puis maintenue : on le modélise donc comme un feu constant. Le côté y=-1,10
  et le haut du domaine (z=4,00) restent ouverts en permanence sur l''extérieur, et
  il n''y a aucune extraction mécanique. Chemin d''évacuation à 1,8 m de hauteur :
  (1,00 ; 2,00 ; 1,80) → (4,75 ; 0,50 ; 1,80) → (4,75 ; -0,80 ; 1,80), en sortant
  par la porte.'
