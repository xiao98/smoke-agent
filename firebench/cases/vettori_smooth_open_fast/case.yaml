title: Smooth Flat Ceiling, Open Burner Location, Fast Growth Rate Fire, Experiments
  1, 2, and 3
t_end_s: 100.0
requirement_status: llm_draft
requirement: 'Simuler l''essai Vettori (plafond lisse, brûleur dégagé, feu à croissance
  rapide) dans un domaine parallélépipédique x 0,0..9,20 m, y 0,0..5,60 m, z 0,0..2,44
  m, avec un maillage uniforme d''environ 0,1 m. L''input officiel utilise 96 × 54
  × 30 cellules, soit environ 0,096 × 0,104 × 0,081 m. Ajouter deux obstructions.
  La première est un socle de brûleur en x 4,30..5,00, y 1,00..2,00, z 0,00..0,30.
  La seconde est une poutre traversant toute la longueur en x 0,00..9,20, y 2,72..2,80,
  z 2,22..2,40. Le foyer est un brûleur au méthane posé sur le socle, d''emprise x
  4,30..4,90, y 1,00..1,60 à z = 0,30 m (0,36 m²). Sa puissance maximale est d''environ
  1055 kW (2930 kW/m²), avec une croissance de type « fast ». Dans l''input officiel,
  la rampe atteint presque 100 % de la puissance à 100 s. L''input officiel déclare
  aussi une ouverture libre en x 8,30..9,20, y 2,90..5,60 à z = 2,64 m. Elle se trouve
  au-dessus du plafond du domaine (2,44 m) et reste donc inactive : traiter le local
  comme fermé, sans ouverture permanente sur les limites ni extraction mécanique.
  La durée de la simulation est de 100 s. Un chemin d''évacuation plausible à 1,8
  m de hauteur va de (1,0 ; 4,5 ; 1,8) à (5,0 ; 4,5 ; 1,8) puis à (8,7 ; 4,5 ; 1,8),
  du côté opposé au brûleur.'
