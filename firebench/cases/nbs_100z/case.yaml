title: NBS Multiroom Test 100Z
t_end_s: 1200.0
requirement_status: llm_draft
requirement: 'Je veux modéliser l''essai multipièces NBS 100Z dans un domaine x 0..12,2, y 0..5,8, z 0..2,4 m, avec un maillage de 0,1 m en trois blocs : pièce du feu x 9,8..12,2, y 0..3,4, z 0..2,2 ; pièce 3 x 2,4..4,6, y 0..3,4, z 0..2,4 ; couloir x 0..12,2, y 3,4..5,8, z 0..2,4 (l''espace hors blocs n''est pas calculé) et une durée de 950 s. Les zones hors volume sont des blocs pleins : x 0..2,4, y 0..3,4, z 0..2,4 ; x 4,6..9,8, y 0..3,4, z 0..2,4 ; et le plafond surbaissé de la pièce du feu, x 9,8..12,2, y 0..3,4, z 2,2..2,4. La pièce du feu (x 9,8..12,2, y 0..3,4) contient un bloc plein x 9,8..11,1, y 2,3..3,4, z 0..2,2, un linteau x 11,1..12,2, y 2,3..3,4, z 2,0..2,2, et un mur x 11,1..12,2, y 3,3..3,4, z 0..2,2 percé d''une porte x 11,2..12,0, z 0..1,6 donnant sur le couloir (y 3,4..5,8). La pièce 3 (x 2,4..4,6, y 0..3,4) comporte un bloc plein x 3,2..4,6, y 2,2..3,4, z 0..2,4 et une imposte x 2,4..3,2, y 3,3..3,4, z 2,0..2,4 ; elle s''ouvre donc sur le couloir par x 2,4..3,2, z 0..2,0.
  Le brûleur est un bloc x 10,9..11,2, y 0..0,3, z 0,4..0,5, dont la face supérieure dégage 110 kW à puissance constante (montée en 1 s), maintenue jusqu''à 900 s puis éteinte. La seule ouverture permanente est la porte en bout de couloir sur la face x = 0, y 4,2..5,0, z 0..2,0, sans aucune extraction mécanique. Le chemin d''évacuation part de la pièce 3 en (2,8 ; 1,5 ; 1,8), passe par (2,8 ; 4,6 ; 1,8) et rejoint la sortie en (0,2 ; 4,6 ; 1,8). Matériaux : parois, plafond et sol de la pièce du feu en fibre céramique isolante 50 mm ; couloir en silicate de calcium 13 mm sur plaque de plâtre 13 mm (matériau par défaut du bâtiment) ; pièce 3 sol en béton, parois par défaut.'
