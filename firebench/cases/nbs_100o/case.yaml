t_end_s: 1200.0
requirement_status: llm_draft
requirement: 'Simuler l''essai multipièces NBS 100O dans un domaine x 0–12,2, y 0–5,8, z 0–2,4 m, avec un maillage de 0,1 m en deux blocs : chambre de feu x 9,8–12,2, y 0–3,4, z 0–2,2 et couloir x 0–12,2, y 3,4–5,8, z 0–2,4 (l''espace hors blocs n''est pas calculé) et une durée de 950 s. Remplir en solide la zone hors maillage x 0–9,8, y 0–3,4, z 0–2,4, ainsi que le volume x 9,8–12,2, y 0–3,4, z 2,2–2,4 situé au-dessus de la chambre de feu, dont le plafond est à 2,2 m. Le couloir occupe x 0–12,2, y 3,4–5,8, z 0–2,4. Dans la chambre de feu, ajouter un bloc plein x 9,8–11,1, y 2,3–3,4, z 0–2,2 et une retombée de plafond x 11,1–12,2, y 2,3–3,4, z 2,0–2,2. Le mur entre la chambre et le couloir va de x 11,1 à 12,2, y 3,3–3,4, z 0–2,0, et il est percé d''une porte x 11,2–12,0, z 0–1,6. Le brûleur au méthane est une surface x 10,9–11,2, y 0–0,3, placée au sommet d''un bloc z 0,4–0,5. Sa puissance est constante à 110 kW, atteinte en 1 s, et il s''éteint à 900 s. La seule ouverture permanente est
  un évent ouvert sur la face x = 0, y 4,2–5,0, z 0–0,1. Il n''y a aucune extraction mécanique. Chemin d''évacuation à 1,8 m de hauteur le long du couloir, de (11,5 ; 4,6 ; 1,8) vers (6,0 ; 4,6 ; 1,8) puis vers (0,2 ; 4,6 ; 1,8). Matériaux : parois, plafond et sol de la chambre de feu en fibre céramique isolante 50 mm ; parois, plafond et sol du couloir en silicate de calcium 13 mm sur plaque de plâtre 13 mm (matériau par défaut du bâtiment).'
rset_s: 120
